name = "winter-workflow"
prefix = "wf"

# Modules this one references and therefore needs when installed standalone.
# winter-product is an optional integration today (the commit skill points at
# its backlog/work layout); declared here until first-class optional-dependency
# support exists.
requires = ["winter-product"]

# `winter lint` checks: validate agent frontmatter and keep runtime-specific
# invocation syntax and adapter paths out of top-level methodology Markdown.
# Paths are relative to this extension directory.
lint = ["scripts/lint-agents.py", "scripts/lint-methodology.py"]
