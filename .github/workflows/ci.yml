name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: dprint check
        run: npx --yes dprint@0.55.2 check
      - name: rumdl check
        run: uvx rumdl@0.2.54 check .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint tests
        run: python3 tests/test_lint_agents.py && python3 tests/test_lint_methodology.py && python3 tests/test_context_usage.py
